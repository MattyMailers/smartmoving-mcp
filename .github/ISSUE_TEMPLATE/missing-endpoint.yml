name: Missing SmartMoving endpoint
description: Request support for a SmartMoving API endpoint or field that is not exposed yet.
title: "Missing endpoint: "
labels: ["missing endpoint", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what endpoint or data shape is missing. Do not paste real customer/job data or API keys.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint or feature
      placeholder: "Example: GET /jobs/{jobId}/actual-materials"
    validations:
      required: false
  - type: textarea
    id: need
    attributes:
      label: What do you need this for?
      description: Describe the agent workflow or operational report this would unlock.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation or notes
      description: Link to public docs or describe fields using fake examples only.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include API keys, real customer data, screenshots with private CRM data, or raw production API responses.
          required: true
